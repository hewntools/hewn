<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideas</title>
<link rel="stylesheet" href="/_platform/ui.css">
<style>
  /* ---------- Look: "Bulb board". Hue 48 ember leads; stages warm up as an idea moves along. ---------- */
  :root {
    --ember: light-dark(oklch(0.72 0.165 48), oklch(0.77 0.15 52));
    --ember-ink: light-dark(oklch(0.52 0.15 45), oklch(0.83 0.12 58));
    --ember-soft: light-dark(oklch(0.72 0.165 48 / 0.14), oklch(0.77 0.15 52 / 0.16));
    --ember-text: light-dark(oklch(0.24 0.06 45), oklch(0.2 0.05 45));

    --accent: var(--ember);
    --accent-text: var(--ember-text);
    --accent-ink: var(--ember-ink);
    --accent-soft: var(--ember-soft);

    /* Stage colours: cool while raw, warm while worked on, green once shipped. */
    --st-raw: light-dark(oklch(0.66 0.02 255), oklch(0.7 0.02 255));
    --st-exploring: light-dark(oklch(0.6 0.1 205), oklch(0.78 0.1 205));
    --st-validating: light-dark(oklch(0.7 0.14 85), oklch(0.84 0.13 88));
    --st-active: var(--ember);
    --st-parked: light-dark(oklch(0.62 0.06 295), oklch(0.74 0.06 295));
    --st-shipped: light-dark(oklch(0.58 0.13 152), oklch(0.8 0.14 152));
    --st-killed: light-dark(oklch(0.56 0.15 25), oklch(0.72 0.14 25));

    --panel: var(--surface-solid);
    --rule: var(--border);
    --display: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --num: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  }
  .st-raw { --st: var(--st-raw); } .st-exploring { --st: var(--st-exploring); } .st-validating { --st: var(--st-validating); }
  .st-active { --st: var(--st-active); } .st-parked { --st: var(--st-parked); } .st-shipped { --st: var(--st-shipped); }
  .st-killed { --st: var(--st-killed); }

  main.page { max-width: 1120px; padding-top: var(--s6); }
  .vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .long { overflow-wrap: anywhere; min-width: 0; }
  .pre { white-space: pre-wrap; }
  .start { align-items: flex-start; }
  .sk-row { min-height: var(--s7); }
  .sk-block { min-height: var(--s8); }
  .chip { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--panel); }
  .chip[aria-pressed="true"] { background: var(--ember-soft); border-color: var(--ember-ink); }
  label.field > .hint.error, .hint.error { color: var(--danger); font-weight: 600; }

  /* ---------- Header: the answer ---------- */
  .masthead { display: flex; gap: var(--s4); align-items: center; }
  .masthead .app-icon { --size: 52px; }
  .masthead h1 { font: 750 34px/1.05 var(--display); letter-spacing: -0.025em; margin: 0; }
  .lead { margin: 6px 0 0; font-size: var(--fs); color: var(--text-2); }
  .lead a { color: var(--text); font-weight: 650; text-decoration-color: var(--ember); text-decoration-thickness: 2px; }
  .lead .stars-inline { color: var(--ember-ink); letter-spacing: 1px; white-space: nowrap; }
  .lead .stale { display: block; margin-top: 2px; color: var(--text-3); font-size: var(--fs-sm); }

  /* ---------- Quick capture: the main action ---------- */
  .composer { margin-top: var(--s5); }
  .composer-bar {
    display: flex; align-items: center; gap: var(--s3); padding: 6px 6px 6px var(--s4);
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: 16px;
    box-shadow: var(--shadow); transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .composer-bar:focus-within { border-color: var(--ember-ink); box-shadow: 0 0 0 4px var(--ember-soft), var(--shadow); }
  .composer-bar .bulb { flex: none; width: 22px; height: 22px; color: var(--ember); }
  .composer-bar input#q-title { flex: 1; min-width: 0; min-height: 44px; border: 0; padding: 0; background: transparent; box-shadow: none; font-size: 17px; }
  .composer-bar input#q-title:focus { box-shadow: none; background: transparent; }
  .composer-bar button.primary { min-height: 44px; padding: 0 18px; font-size: var(--fs); border-radius: 11px; font-weight: 650; }
  #q-title-msg:empty { display: none; }
  #q-title-msg { display: block; margin: 6px 0 0 var(--s4); font-size: var(--fs-xs); }
  .composer details { margin-top: var(--s2); padding-left: var(--s4); }
  details > summary { cursor: pointer; font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); width: fit-content; min-height: 36px; display: flex; align-items: center; gap: 8px; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before {
    content: ""; flex: none; width: 6px; height: 6px; margin: 0 2px 0 1px; border-right: 2px solid var(--ember-ink); border-bottom: 2px solid var(--ember-ink);
    transform: rotate(-45deg); transition: transform var(--dur) var(--ease);
  }
  details[open] > summary::before { transform: rotate(45deg) translate(-1px, -1px); }
  details > summary:hover { color: var(--text); }
  details[open] > summary { margin-bottom: var(--s2); }
  #q-extra { padding: var(--s2) var(--s4) var(--s3); background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius-lg); }
  #q-error:empty { display: none; }
  #q-error { margin-top: var(--s2); }

  /* ---------- Layout ---------- */
  .board { display: grid; grid-template-columns: minmax(0, 1fr) 372px; grid-template-areas: "list map"; gap: var(--s5); margin-top: var(--s6); align-items: start; }
  .board > * { min-width: 0; }
  #map-wrap { grid-area: map; position: sticky; top: var(--s4); }
  #list-section { grid-area: list; }
  @media (max-width: 880px) {
    .board { grid-template-columns: minmax(0, 1fr); grid-template-areas: "map" "list"; gap: var(--s5); }
    #map-wrap { position: static; }
  }

  /* ---------- Signature: the stage × rating map ---------- */
  .map { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius-lg); padding: var(--s4); box-shadow: var(--shadow); }
  .map h2 { margin: 0; font: 700 var(--fs-lg)/1.2 var(--display); letter-spacing: -0.01em; }
  .map .cap { margin: 4px 0 var(--s3); font-size: var(--fs-sm); color: var(--text-2); }
  .map-grid { --lab: 116px; --cols: var(--lab) repeat(6, minmax(0, 1fr)); display: flex; flex-direction: column; }
  .map-axis, .map-row { display: grid; grid-template-columns: var(--cols); }
  .map-axis { padding-bottom: 6px; }
  .map-axis > span { font: 600 var(--fs-xs)/1 var(--num); color: var(--text-3); text-align: center; font-variant-numeric: tabular-nums; }
  .map-axis > span.hot { color: var(--ember-ink); }
  .map-axis > span:first-child { text-align: left; font-family: var(--font); font-weight: 500; }
  .heat { height: 4px; margin: 0 0 6px var(--lab); border-radius: 2px; background: linear-gradient(90deg, var(--surface-3), color-mix(in oklch, var(--ember) 35%, transparent) 50%, var(--ember)); }
  .map-row { min-height: 38px; border-top: 1px solid var(--rule); }
  .map-row.gap { margin-top: 8px; border-top: 1px dashed var(--border-strong); }
  .map-row > button.stage {
    justify-content: flex-start; gap: 7px; min-height: 38px; height: 100%; padding: 0 6px; margin-left: -6px; border: 1px solid transparent; border-radius: 8px;
    background: transparent; font-weight: 600; font-size: var(--fs-sm); color: var(--text); min-width: 0;
  }
  .map-row > button.stage:hover { background: var(--surface-2); }
  .map-row > button.stage[aria-pressed="true"] { background: var(--ember-soft); border-color: var(--ember-ink); }
  .map-row > button.stage .sq { width: 9px; height: 9px; border-radius: 2px; background: var(--st); flex: none; }
  .map-row > button.stage .nm { overflow: hidden; text-overflow: ellipsis; }
  .map-row > button.stage .n { margin-left: auto; padding-right: 8px; font: 600 var(--fs-sm)/1 var(--num); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .map-row > button.stage .n.zero { color: var(--text-3); font-weight: 500; }
  .map-row.off > button.stage { color: var(--text-2); }
  .cell { display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 3px; padding: 5px 2px; border-left: 1px dashed var(--rule); }
  .cell.r4 { background: color-mix(in oklch, var(--ember) 5%, transparent); }
  .cell.r5 { background: color-mix(in oklch, var(--ember) 10%, transparent); }
  a.px {
    display: block; width: 13px; height: 13px; border-radius: 3px; background: var(--st);
    box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--text) 10%, transparent);
    transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    animation: pop .42s var(--ease) both; animation-delay: calc(var(--i, 0) * 28ms);
  }
  a.px.r5 { box-shadow: 0 0 0 3px color-mix(in oklch, var(--st) 28%, transparent); }
  a.px:hover, a.px.hl, a.px:focus-visible { transform: scale(1.35); }
  a.px.dim { opacity: .22; }
  .cell .more { font: 600 10px/13px var(--num); color: var(--text-2); }
  @keyframes pop { from { transform: scale(0); opacity: 0; } }
  .map-foot { margin-top: var(--s3); font-size: var(--fs-xs); color: var(--text-3); }
  @media (max-width: 600px) {
    .map { padding: var(--s3) var(--s4); }
    .map .cap { margin-bottom: var(--s2); }
    .map-row, .map-row > button.stage { min-height: 36px; }
    .map-row.gap { margin-top: 4px; }
    .cell { padding: 3px 2px; }
    .map-foot { margin-top: var(--s2); }
    .masthead .app-icon { --size: 44px; }
    .masthead h1 { font-size: 30px; }
  }

  /* ---------- Toolbar ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
  .toolbar .segmented { flex: none; }
  .segmented button { min-height: 32px; gap: 6px; }
  .segmented button .n { font: 600 var(--fs-xs)/1 var(--num); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .segmented button[aria-pressed="true"] .n { color: var(--ember-ink); }
  .search { position: relative; flex: 1 1 200px; min-width: 0; }
  .search svg { position: absolute; left: 11px; top: 50%; width: 15px; height: 15px; margin-top: -7.5px; color: var(--text-3); pointer-events: none; }
  .search input { padding-left: 34px; min-height: 38px; }
  .selects { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .selects select { width: auto; min-height: 38px; }
  .active-filters { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-top: var(--s2); }
  .active-filters:empty { display: none; }
  .active-filters .chip { min-height: 30px; font-size: var(--fs-xs); }
  @media (max-width: 600px) {
    .search { flex-basis: 140px; }
    .selects { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.2fr); width: 100%; }
    .selects select { width: 100%; padding-left: 9px; padding-right: 24px; background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; }
  }

  /* ---------- Idea rows ---------- */
  #list-wrap { margin-top: var(--s4); }
  .group-h { display: flex; align-items: baseline; gap: var(--s2); margin: var(--s5) 0 var(--s2); font: 700 var(--fs)/1.2 var(--display); }
  .group-h .n { font: 600 var(--fs-sm)/1 var(--num); color: var(--text-2); }
  .group-h .why { font: 400 var(--fs-sm)/1.2 var(--font); color: var(--text-3); }
  ul.ideas { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }
  li.idea {
    position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 118px 84px 92px; grid-template-areas: "main stage rating time";
    gap: var(--s2) var(--s4); align-items: center; padding: 14px var(--s4) 14px 20px; border-top: 1px solid var(--rule);
    transition: background var(--dur) var(--ease);
  }
  li.idea:first-child { border-top: 0; }
  li.idea::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 3px 3px 0; background: var(--st); }
  li.idea.hl, li.idea:hover { background: color-mix(in oklch, var(--st) 6%, transparent); }
  .idea-main { grid-area: main; min-width: 0; overflow-wrap: anywhere; }
  a.idea-title { display: inline; color: var(--text); font-weight: 650; font-size: 16px; line-height: 1.3; text-decoration: none; }
  a.idea-title:hover { text-decoration: underline; text-decoration-color: var(--ember); text-decoration-thickness: 2px; }
  .pitch { margin-top: 3px; font-size: var(--fs-sm); color: var(--text-2); }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .idea-meta { display: flex; flex-wrap: wrap; gap: 6px var(--s3); align-items: center; margin-top: 8px; font-size: var(--fs-xs); color: var(--text-3); }
  .idea-meta:empty { display: none; }
  button.tag {
    min-height: 26px; padding: 0 9px; border-radius: var(--radius-pill); font: 500 var(--fs-xs)/1 var(--font);
    color: var(--text-2); background: var(--surface-2); border: 1px solid transparent;
  }
  button.tag:hover { color: var(--text); background: var(--surface-3); }
  button.tag[aria-pressed="true"] { color: var(--text); background: var(--ember-soft); border-color: var(--ember-ink); }
  .meta-bit { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .meta-bit svg { width: 13px; height: 13px; flex: none; }
  a.meta-bit { color: var(--text-2); text-decoration: none; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; }
  a.meta-bit:hover { color: var(--ember-ink); text-decoration: underline; }
  .idea-stage { grid-area: stage; }
  .idea-rating { grid-area: rating; }
  .idea-time { grid-area: time; text-align: right; font-size: var(--fs-sm); color: var(--text-3); white-space: nowrap; }
  @media (max-width: 600px) {
    li.idea { grid-template-columns: auto auto minmax(0, 1fr); grid-template-areas: "main main main" "stage rating time"; gap: 10px var(--s3); padding: 14px var(--s3) 14px 18px; }
  }

  .stage-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; border-radius: var(--radius-pill); font-size: var(--fs-xs); font-weight: 600; color: var(--text); background: color-mix(in oklch, var(--st) 15%, transparent); white-space: nowrap; }
  .stage-pill::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--st); }
  .stars-ro { white-space: nowrap; color: color-mix(in oklch, var(--text-3) 55%, transparent); font-size: 14px; letter-spacing: 1px; }
  .stars-ro .on { color: var(--ember); }
  .unrated { font-size: var(--fs-xs); color: var(--text-3); }

  .list-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin-top: var(--s3); font-size: var(--fs-sm); color: var(--text-2); }

  /* ---------- Empty ---------- */
  .first-run { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s2); padding: var(--s7) var(--s4); background: var(--panel); border: 1px dashed var(--border-strong); border-radius: var(--radius-lg); }
  .first-run svg { width: 56px; height: 56px; color: var(--ember); margin-bottom: var(--s2); }
  .first-run strong { font: 700 var(--fs-lg)/1.2 var(--display); }
  .first-run p { margin: 0 0 var(--s2); color: var(--text-2); max-width: 36ch; }
  .empty { background: var(--panel); }

  /* ---------- Rating input ---------- */
  .rating { margin: var(--s3) 0; }
  .stars { display: inline-flex; align-items: center; gap: 2px; }
  .stars > button { color: color-mix(in oklch, var(--text-3) 60%, transparent); font-size: 20px; }
  .stars > button.on { color: var(--ember); }

  /* ---------- Detail dialog ---------- */
  dialog { background: var(--panel); -webkit-backdrop-filter: none; backdrop-filter: none; }
  dialog.wide { width: min(660px, 94vw); }
  #detail h2#d-heading { font: 700 var(--fs-xl)/1.15 var(--display); letter-spacing: -0.015em; margin: 0; }
  .d-sub { display: flex; flex-wrap: wrap; gap: 4px var(--s4); font-size: var(--fs-sm); color: var(--text-2); }
  .track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: var(--s2); }
  .track > span { display: flex; flex-direction: column; gap: 5px; font-size: var(--fs-xs); color: var(--text-3); min-width: 0; }
  .track > span::before { content: ""; height: 6px; border-radius: 3px; background: var(--surface-3); }
  .track > span.done::before { background: color-mix(in oklch, var(--st) 55%, transparent); }
  .track > span.now { color: var(--text); font-weight: 650; }
  .track > span.now::before { background: var(--st); }
  .d-section { padding-top: var(--s4); border-top: 1px solid var(--rule); }
  .d-section h3 { margin: 0 0 var(--s2); font: 700 var(--fs)/1.2 var(--display); display: flex; gap: var(--s2); align-items: baseline; }
  .d-section h3 .n { font: 600 var(--fs-sm)/1 var(--num); color: var(--text-2); }
  .note-when { display: flex; flex-wrap: wrap; gap: 2px var(--s3); font-size: var(--fs-xs); color: var(--text-3); margin-top: 4px; }
</style>
</head>
<body>
<main class="page">
  <header class="masthead">
    <span class="app-icon" style="--hue: 48" aria-hidden="true">
      <svg viewBox="0 0 5 5"><rect x="1" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="3" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="2" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="1" y="2" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="1" y="4" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/></svg>
    </span>
    <div class="long">
      <h1>Ideas</h1>
      <p class="lead" id="lead" aria-live="polite"><span class="skeleton" style="width: 18em">&nbsp;</span></p>
    </div>
  </header>

  <form class="composer" id="quick" novalidate autocomplete="off" aria-label="Add an idea">
    <div class="composer-bar">
      <svg class="bulb" viewBox="0 0 5 5" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="0" width="3" height="1"/><rect x="0" y="1" width="5" height="1"/><rect x="1" y="2" width="3" height="1"/><rect x="1" y="4" width="3" height="1"/></svg>
      <label for="q-title" class="vh">New idea</label>
      <input type="text" id="q-title" name="title" required autofocus aria-describedby="q-title-msg" placeholder="What's the idea?">
      <button type="submit" class="primary" id="q-submit">Add idea</button>
    </div>
    <span class="hint" id="q-title-msg"></span>
    <details id="q-more">
      <summary>Add a pitch, link, tags, rating or note</summary>
      <div class="grid" id="q-extra"></div>
    </details>
    <div id="q-error" aria-live="polite"></div>
  </form>

  <div class="board">
    <aside id="map-wrap" aria-label="Where your ideas stand">
      <div class="map"><div class="skeleton" style="min-height: 300px"></div></div>
    </aside>

    <section id="list-section" aria-label="Ideas">
      <div class="toolbar" role="search">
        <div class="segmented" id="view-toggle" role="group" aria-label="Show">
          <button type="button" data-view="open" aria-pressed="true">Open <span class="n" id="n-open"></span></button>
          <button type="button" data-view="closed" aria-pressed="false">Closed <span class="n" id="n-closed"></span></button>
        </div>
        <label class="search">
          <span class="vh">Search ideas</span>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
          <input type="search" id="search" placeholder="Search ideas" title="Searches titles, pitches and notes">
        </label>
        <div class="selects">
          <select id="f-tag" class="sm" aria-label="Tag"><option value="">Any tag</option></select>
          <select id="f-rating" class="sm" aria-label="Rating">
            <option value="">Any rating</option>
            <option value="2">2+ stars</option>
            <option value="3">3+ stars</option>
            <option value="4">4+ stars</option>
            <option value="5">5 stars</option>
          </select>
          <select id="f-sort" class="sm" aria-label="Sort">
            <option value="rating">Best first</option>
            <option value="updated">Last changed</option>
            <option value="created">Newest</option>
            <option value="status">By stage</option>
          </select>
        </div>
      </div>
      <div class="active-filters" id="status-chips" role="group" aria-label="Active filters"></div>

      <div id="list-wrap" aria-busy="true">
        <div class="stack">
          <div class="skeleton sk-row"></div>
          <div class="skeleton sk-row"></div>
          <div class="skeleton sk-row"></div>
        </div>
      </div>
    </section>
  </div>
</main>

<dialog id="detail" class="wide" aria-labelledby="d-heading"><div class="stack" id="detail-body"></div></dialog>
<dialog id="confirm" role="alertdialog" aria-labelledby="c-heading" aria-describedby="c-text">
  <form method="dialog">
    <h2 id="c-heading"></h2>
    <p id="c-text" class="muted long"></p>
    <div class="actions">
      <button value="cancel" autofocus>Cancel</button>
      <button value="ok" class="danger solid" id="c-ok"></button>
    </div>
  </form>
</dialog>

<datalist id="tag-options"></datalist>
<div class="toast-region" id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="./app.js"></script>
</body>
