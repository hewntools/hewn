<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideas</title>
<link rel="stylesheet" href="/_platform/ui.css">
<style>
  /* Only what the design system has no class for, built from its tokens. */
  .long { overflow-wrap: anywhere; min-width: 0; }
  .pre { white-space: pre-wrap; }
  .end { align-items: flex-end; }
  .start { align-items: flex-start; }
  .row > .grow { flex: 1 1 calc(var(--s8) * 3); min-width: 0; }
  label.field > .hint.error { color: var(--danger); font-weight: 600; }
  .sk-row { min-height: var(--s7); }
  .sk-block { min-height: var(--s8); }
  details > summary { cursor: pointer; font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
  details[open] > summary { margin-bottom: var(--s3); }

  /* Star rating: ghost icon buttons; set stars in accent ink, unset in secondary text. */
  .rating { margin: var(--s3) 0; }
  .stars { display: inline-flex; align-items: center; gap: var(--s1); }
  .stars > button { color: var(--text-2); font-size: var(--fs-lg); }
  .stars > button.on, .stars-ro .on { color: var(--accent-ink); }
  .stars-ro { white-space: nowrap; color: var(--text-2); letter-spacing: var(--track-caps); }

  /* Idea titles in the list are links that open the idea. Long pitches show two lines. */
  a.idea-title { color: var(--text); font-weight: 600; text-decoration: none; }
  a.idea-title:hover { text-decoration: underline; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .list > li.idea .meta { justify-content: flex-end; }
  @media (max-width: 600px) {
    .list > li.idea { flex-wrap: wrap; }
    .list > li.idea .meta { justify-content: flex-start; flex-basis: 100%; }
  }

  /* The idea dialog holds a whole form, so it is wider than the default dialog. */
  dialog.wide { width: min(640px, 92vw); }
</style>
</head>
<body>
<main class="page stack">
  <header class="row between">
    <div class="row">
      <span class="app-icon md" style="--hue: 48" aria-hidden="true">
        <svg viewBox="0 0 5 5"><rect x="1" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="3" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="2" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="1" y="2" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="1" y="4" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/></svg>
      </span>
      <div>
        <div class="eyebrow">Idea Tracker</div>
        <h1>Ideas</h1>
      </div>
    </div>
    <div class="stats" id="stats" aria-live="polite">
      <div class="stat"><div class="value skeleton">&nbsp;</div><div class="label">Open</div></div>
      <div class="stat"><div class="value skeleton">&nbsp;</div><div class="label">Active</div></div>
      <div class="stat"><div class="value skeleton">&nbsp;</div><div class="label">Shipped</div></div>
    </div>
  </header>

  <form class="card stack" id="quick" novalidate autocomplete="off" aria-label="Add an idea">
    <div class="row end">
      <label class="field grow">
        <span class="label">New idea</span>
        <input type="text" id="q-title" name="title" required autofocus aria-describedby="q-title-msg" placeholder="What's the idea?">
        <span class="hint" id="q-title-msg"></span>
      </label>
      <button type="submit" class="primary" id="q-submit">Add idea</button>
    </div>
    <details id="q-more">
      <summary>More details</summary>
      <div class="grid" id="q-extra"></div>
    </details>
    <div id="q-error" aria-live="polite"></div>
  </form>

  <section class="stack" aria-label="Filters">
    <div class="row end">
      <div class="segmented" id="view-toggle" role="group" aria-label="Show">
        <button type="button" data-view="open" aria-pressed="true">Open</button>
        <button type="button" data-view="closed" aria-pressed="false">Closed</button>
      </div>
      <label class="field grow">
        <span class="label">Search</span>
        <input type="search" id="search" placeholder="Title, pitch or notes">
      </label>
    </div>
    <div class="row" id="status-chips" role="group" aria-label="Status"></div>
    <div class="row end">
      <label class="field"><span class="label">Tag</span><select id="f-tag" class="sm"><option value="">Any tag</option></select></label>
      <label class="field"><span class="label">Rating</span>
        <select id="f-rating" class="sm">
          <option value="">Any rating</option>
          <option value="2">2+ stars</option>
          <option value="3">3+ stars</option>
          <option value="4">4+ stars</option>
          <option value="5">5 stars</option>
        </select>
      </label>
      <label class="field"><span class="label">Sort</span>
        <select id="f-sort" class="sm">
          <option value="rating">Best first</option>
          <option value="updated">Recently changed</option>
          <option value="created">Newest</option>
          <option value="status">By stage</option>
        </select>
      </label>
      <button type="button" class="ghost sm" id="f-clear" hidden>Clear filters</button>
    </div>
  </section>

  <section id="list-wrap" aria-label="Ideas" aria-busy="true">
    <div class="stack">
      <div class="skeleton sk-row"></div>
      <div class="skeleton sk-row"></div>
      <div class="skeleton sk-row"></div>
    </div>
  </section>
</main>

<dialog id="detail" class="wide" aria-labelledby="d-heading"><div class="stack" id="detail-body"></div></dialog>
<dialog id="confirm" role="alertdialog" aria-labelledby="c-heading" aria-describedby="c-text">
  <form method="dialog">
    <h2 id="c-heading"></h2>
    <p id="c-text" class="muted long"></p>
    <div class="actions">
      <button value="cancel" autofocus>Cancel</button>
      <button value="ok" class="danger solid" id="c-ok"></button>
    </div>
  </form>
</dialog>

<datalist id="tag-options"></datalist>
<div class="toast-region" id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
