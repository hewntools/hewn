<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plant Log</title>
  <link rel="stylesheet" href="/_platform/ui.css">
  <style>
    /* ---------- tokens: leaf green leads, water blue second, feed amber, shelf wood ---------- */
    :root, [data-theme] {
      --leaf: light-dark(oklch(0.52 0.13 140), oklch(0.78 0.14 140));
      --leaf-2: light-dark(oklch(0.63 0.14 132), oklch(0.66 0.13 148));
      --leaf-stem: light-dark(oklch(0.45 0.09 135), oklch(0.6 0.1 138));
      --leaf-dry: light-dark(oklch(0.68 0.11 105), oklch(0.72 0.1 102));
      --leaf-dry-2: light-dark(oklch(0.75 0.1 95), oklch(0.62 0.09 98));
      --leaf-parched: light-dark(oklch(0.64 0.1 72), oklch(0.68 0.09 70));
      --leaf-soft: light-dark(oklch(0.52 0.13 140 / 0.12), oklch(0.78 0.14 140 / 0.16));
      --water: light-dark(oklch(0.56 0.13 245), oklch(0.76 0.11 240));
      --water-soft: light-dark(oklch(0.56 0.13 245 / 0.1), oklch(0.76 0.11 240 / 0.13));
      --feed: light-dark(oklch(0.62 0.13 70), oklch(0.82 0.12 78));
      --feed-soft: light-dark(oklch(0.62 0.13 70 / 0.14), oklch(0.82 0.12 78 / 0.14));
      --repot: light-dark(oklch(0.52 0.06 55), oklch(0.74 0.06 60));
      --repot-soft: light-dark(oklch(0.52 0.06 55 / 0.13), oklch(0.74 0.06 60 / 0.15));
      --ceramic: light-dark(oklch(0.965 0.008 80), oklch(0.31 0.008 80));
      --ceramic-edge: light-dark(oklch(0.8 0.015 80), oklch(0.44 0.01 80));
      --wood: light-dark(oklch(0.82 0.04 72), oklch(0.37 0.03 65));
      --wood-edge: light-dark(oklch(0.72 0.045 68), oklch(0.29 0.025 65));

      --accent: var(--leaf);
      --accent-text: light-dark(oklch(1 0 0), oklch(0.2 0.04 140));
      --accent-ink: light-dark(oklch(0.46 0.12 140), oklch(0.8 0.13 140));
      --accent-soft: var(--leaf-soft);

      --display: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      --botanical: ui-serif, Georgia, serif;
    }

    .page { max-width: 1040px; }
    h1, h2 { font-family: var(--display); }
    h2 { font-weight: 700; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .card { background: var(--surface-solid); }

    /* ---------- header ---------- */
    header.top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
    header.top h1 { margin: 0; font-size: 34px; font-weight: 750; letter-spacing: -0.025em; }
    .today-date { margin: 2px 0 0; color: var(--text-2); font-size: var(--fs-sm); }
    .btn-icon { width: 14px; height: 14px; flex: none; }

    /* ---------- home: top row ---------- */
    .home-top { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); align-items: stretch; margin-top: var(--s4) !important; }
    .home-top > * { min-width: 0; margin: 0; }

    .today-card { padding: var(--s5); }
    .today-title { margin: 0; display: flex; align-items: baseline; gap: 10px; font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }
    .today-title .big { font-size: 60px; line-height: 0.85; font-weight: 750; letter-spacing: -0.045em; color: var(--water); font-variant-numeric: tabular-nums; }
    .today-title .big.late { color: var(--danger); }
    .lede-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); margin-top: var(--s2); }
    .today-lede { margin: 0; color: var(--text-2); font-size: var(--fs-sm); min-width: 0; }
    .lede-row .ghost { flex: none; color: var(--accent-ink); margin-right: calc(-1 * var(--s2)); }

    .due-list { list-style: none; margin: var(--s4) 0 0; padding: 0; }
    .due-list > li { display: flex; align-items: center; gap: var(--s1); border-top: 1px solid var(--border); padding: 4px 0; }
    .due-check { display: flex; align-items: center; gap: var(--s3); flex: 1; min-width: 0; min-height: 56px; cursor: pointer; }
    .drop-check { -webkit-appearance: none; appearance: none; position: relative; flex: none; width: 26px; height: 26px; margin: 0; border-radius: 50%; border: 2px solid var(--water); background: transparent; cursor: pointer; transition: background var(--dur) var(--ease); }
    .drop-check::after { content: ""; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px; border: solid transparent; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
    .drop-check:checked { background: var(--water); }
    .drop-check:checked::after { border-color: var(--surface-solid); }
    .mini-pot { flex: none; line-height: 0; }
    .mini-pot svg { width: 34px; height: 43px; }
    .due-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .due-text .name { font-weight: 650; overflow-wrap: anywhere; line-height: 1.25; }
    .due-text .sub { font-size: var(--fs-sm); color: var(--text-2); overflow-wrap: anywhere; line-height: 1.3; }
    .due-when { flex: none; display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 1px; max-width: 46%; }
    .due-when .when { font-weight: 650; font-size: var(--fs-sm); color: var(--warn); white-space: nowrap; }
    .due-list > li.late .due-when .when { color: var(--danger); }
    .due-when .last { font-size: var(--fs-xs); color: var(--text-2); }
    .open-link { flex: none; width: 36px; min-height: 40px; padding: 0; color: var(--text-3); }
    .open-link svg { width: 8px; height: 14px; }
    .due-actions { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); }
    .due-actions .primary { flex: 1 1 auto; }
    #water-error { margin-top: var(--s3); }

    .all-done { display: flex; align-items: center; gap: var(--s4); }
    .all-done .done-badge { flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--leaf-soft); color: var(--leaf); }
    .all-done .done-badge svg { width: 30px; height: 30px; }
    .all-done h2 { margin: 0; font-size: var(--fs-xl); }
    .all-done p { margin: 4px 0 0; color: var(--text-2); }

    /* ---------- home: 14-day schedule ---------- */
    .sched-card { padding: var(--s5); }
    .sched-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2) var(--s4); flex-wrap: wrap; }
    .sched-head h2 { margin: 0; font-size: var(--fs-lg); }
    .sched-head .insight { color: var(--text-2); font-size: var(--fs-sm); }
    .sched-head .insight b { color: var(--water); font-weight: 650; }
    .sched { --label: 104px; margin-top: var(--s4); }
    .sched-row { display: grid; grid-template-columns: var(--label) repeat(14, minmax(0, 1fr)); align-items: stretch; }
    .sched-row { position: relative; }
    .sched-row + .sched-row { border-top: 1px dashed var(--border); }
    .sched-later { position: absolute; right: 0; top: 50%; transform: translateY(-50%); padding: 3px 8px; border-radius: var(--radius-pill); background: var(--surface-solid); box-shadow: 0 0 0 1px var(--border); font-size: var(--fs-xs); color: var(--text-2); white-space: nowrap; pointer-events: none; }
    .sched-days { border-bottom: 1px solid var(--border); }
    .sched-days .d { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 0 6px; font-size: 10.5px; color: var(--text-2); line-height: 1.15; border-radius: 8px 8px 0 0; }
    .sched-days .d b { font-size: 12.5px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    .sched-days .d.today, .sched .cell.today { background: var(--water-soft); }
    .sched-days .d.today b, .sched-days .d.today { color: var(--water); }
    .sched .cell.weekend { background: color-mix(in oklch, var(--text) 3%, transparent); }
    .sched-name { display: flex; align-items: center; min-width: 0; padding-right: var(--s2); font-size: var(--fs-sm); font-weight: 600; color: var(--text); text-decoration: none; min-height: 36px; }
    .sched-name span:first-child { overflow-wrap: anywhere; line-height: 1.15; padding: 4px 0; }
    .sched-name:hover { color: var(--accent-ink); }
    .sched .cell { position: relative; display: grid; place-items: center; min-height: 36px; }
    .sched .mk { width: 11px; height: 15px; fill: var(--water); display: block; }
    .sched .mk.late { fill: var(--danger); }
    .sched .feed-dot { position: absolute; bottom: 3px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--feed); }
    .sched .feed-dot.late { box-shadow: 0 0 0 1.5px var(--danger); }
    .sched-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s2) var(--s4); flex-wrap: wrap; margin-top: var(--s3); }
    .legend { display: flex; gap: var(--s4); flex-wrap: wrap; font-size: var(--fs-xs); color: var(--text-2); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend svg { width: 9px; height: 12px; fill: var(--water); }
    .legend svg.late { fill: var(--danger); }
    .legend i { width: 6px; height: 6px; border-radius: 50%; background: var(--feed); }

    /* ---------- home: the windowsill ---------- */
    .sill-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2) var(--s4); flex-wrap: wrap; margin-top: var(--s7) !important; }
    .sill-head h2 { margin: 0; font-size: var(--fs-xl); }
    .sill-head .count { color: var(--text-2); font-size: var(--fs-sm); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips .chip { min-height: 36px; background: var(--surface-solid); -webkit-backdrop-filter: none; backdrop-filter: none; }
    .chip[aria-pressed="true"] { background: var(--leaf-soft); border-color: var(--leaf); color: var(--text); }
    .sill { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--s5) var(--s5); }
    .shelf { min-width: 0; max-width: 100%; }
    .shelf h3 { margin: 0 0 var(--s1); padding-left: 4px; font: 600 var(--fs-sm)/1.3 var(--font); color: var(--text-2); overflow-wrap: anywhere; }
    .shelf h3 .n { color: var(--text-3); font-weight: 500; margin-left: 4px; }
    .pots { display: flex; flex-wrap: wrap; }
    .pot-tile { --w: 124px; width: var(--w); display: flex; flex-direction: column; align-items: center; text-align: center; color: var(--text); text-decoration: none; border-radius: var(--radius); padding-bottom: var(--s2); }
    .pot-tile:hover { color: var(--text); }
    .pot-tile:focus-visible { outline-offset: 0; }
    .pot-stage { width: 100%; display: flex; justify-content: center; padding: var(--s2) 0 8px;
      background: linear-gradient(var(--wood-edge), var(--wood-edge)) bottom / 100% 2px no-repeat, linear-gradient(var(--wood), var(--wood)) bottom 2px left 0 / 100% 7px no-repeat; }
    .pots .pot-tile:first-child .pot-stage { border-bottom-left-radius: 4px; }
    .pot-stage svg { width: 78px; height: 98px; display: block; transition: transform var(--dur-slow) var(--ease); }
    .pot-tile:hover .pot-stage svg { transform: translateY(-3px); }
    .pt-name { margin-top: var(--s2); padding: 0 6px; font-weight: 650; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
    .pt-when { margin-top: 3px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); color: var(--text-2); font-variant-numeric: tabular-nums; }
    .pt-when svg { width: 8px; height: 11px; fill: var(--water); flex: none; }
    .pot-tile.today .pt-when { color: var(--warn); font-weight: 600; }
    .pot-tile.today .pt-when svg { fill: var(--warn); }
    .pot-tile.overdue .pt-when { color: var(--danger); font-weight: 600; }
    .pot-tile.overdue .pt-when svg { fill: var(--danger); }
    .pt-feed { margin-top: 2px; display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); color: var(--feed); font-weight: 600; }
    .pt-feed::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* ---------- the pot illustration ---------- */
    .pot { overflow: visible; }
    .pot .leaf { fill: var(--leaf); transition: fill var(--dur-slow) var(--ease); }
    .pot .leaf-2 { fill: var(--leaf-2); transition: fill var(--dur-slow) var(--ease); }
    .pot .stem { fill: none; stroke: var(--leaf-stem); stroke-width: 2; stroke-linecap: round; }
    .pot .vein { fill: none; stroke: var(--leaf-stem); stroke-width: 1; stroke-linecap: round; opacity: 0.55; }
    .pot .pot-body, .pot .pot-rim { fill: var(--ceramic); stroke: var(--ceramic-edge); stroke-width: 1.2; }
    .pot .pot-water { fill: var(--water); opacity: 0.38; }
    .pot .pot-waterline { stroke: var(--water); stroke-width: 2.2; }
    .pot .foliage.back { transform-box: view-box; transform-origin: 40px 61px; transition: transform var(--dur-slow) var(--ease); }
    .pot.thirsty .leaf { fill: var(--leaf-dry); }
    .pot.thirsty .leaf-2 { fill: var(--leaf-dry-2); }
    .pot.thirsty .foliage.back { transform: scale(1.05, 0.86); }
    .pot.parched .leaf, .pot.parched .leaf-2 { fill: var(--leaf-parched); }
    .pot.parched .foliage.back { transform: rotate(-5deg) scale(1.08, 0.76); }

    /* ---------- add form + empty ---------- */
    .two { display: grid; gap: 0 var(--s3); grid-template-columns: 1fr 1fr; }
    .two > * { min-width: 0; }
    .card > h2:first-child, form.card > h2:first-child { margin-top: 0; }
    .card > .row:first-child h2 { margin: 0; }
    .card label.field:first-of-type { margin-top: 0; }
    .candidates { margin: var(--s3) 0; }
    .candidates .list .name { font-weight: 600; }
    .candidates .list .name, .candidates .list .sub { white-space: normal; overflow-wrap: anywhere; }
    .candidates .list > li { align-items: flex-start; }
    .candidates h3 { margin: 0 0 var(--s1); font-size: var(--fs-sm); color: var(--text-2); }
    .empty-sill { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s2); padding: var(--s5) var(--s4) var(--s4); }
    .empty-sill svg.pot { width: 96px; height: 120px; }
    .empty-sill strong { font: 700 var(--fs-lg) var(--display); }
    .empty-sill span { color: var(--text-2); max-width: 46ch; }

    /* ---------- plant page ---------- */
    .back { margin-left: calc(-1 * var(--s3)); }
    .plant-layout { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr); align-items: start; }
    .plant-layout > * { min-width: 0; margin: 0 !important; }
    .plant-hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s5); align-items: center; padding: var(--s5); }
    .hero-pot { line-height: 0; }
    .hero-pot svg { width: 116px; height: 145px; }
    .hero-text { min-width: 0; }
    .hero-text h1 { margin: 0; font-size: 38px; font-weight: 750; letter-spacing: -0.03em; overflow-wrap: anywhere; }
    .species { margin: 2px 0 0; font: italic 16px/1.35 var(--botanical); color: var(--text-2); overflow-wrap: anywhere; }
    .where { margin: 4px 0 0; color: var(--text-2); font-size: var(--fs-sm); display: inline-flex; align-items: center; gap: 6px; }
    .where svg { width: 13px; height: 13px; flex: none; }
    .hero-status { margin: var(--s3) 0 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 700 21px/1.2 var(--display); color: var(--water); }
    .hero-status svg { width: 13px; height: 18px; fill: currentColor; flex: none; }
    .hero-status.today { color: var(--warn); }
    .hero-status.overdue { color: var(--danger); }
    .hero-status .on { font: 500 var(--fs-sm) var(--font); color: var(--text-2); }
    .facts { display: grid; grid-template-columns: repeat(2, minmax(96px, auto)); gap: var(--s3) var(--s5); margin: 0; align-self: center; }
    .facts > div { min-width: 0; }
    .facts dt { font-size: var(--fs-xs); color: var(--text-2); }
    .facts dd { margin: 1px 0 0; font: 650 16px/1.25 var(--display); font-variant-numeric: tabular-nums; }
    .facts dd.bad { color: var(--danger); }
    .facts dd.due { color: var(--warn); }

    .rhythm-card { padding: var(--s5); }
    .rhythm-card .sched-head { margin-bottom: var(--s3); }
    .rhythm-chart { min-height: 120px; }
    .rhythm-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .rh-label { font: 600 12px var(--font); fill: var(--text-2); }
    .rh-axis { font: 11px var(--font); fill: var(--text-2); }
    .rh-axis.today { fill: var(--text); font-weight: 650; }
    .rh-base { stroke: var(--border-strong); stroke-dasharray: 1 4; stroke-linecap: round; }
    .rh-tick { stroke: var(--border); }
    .rh-today { stroke: var(--text-3); stroke-width: 1; }
    .rh-future { fill: var(--water-soft); opacity: 0.6; }
    .rh-gap { stroke: var(--water); stroke-width: 3; stroke-linecap: round; opacity: 0.32; }
    .rh-gap.late { stroke: var(--danger); opacity: 0.55; }
    .rh-plan { stroke: var(--water); stroke-width: 1.6; stroke-dasharray: 3 3; fill: none; }
    .rh-plan.late { stroke: var(--danger); stroke-dasharray: none; stroke-width: 3; opacity: 0.55; stroke-linecap: round; }
    .rh-drop { fill: var(--water); }
    .rh-next { fill: var(--surface-solid); stroke: var(--water); stroke-width: 1.5; }
    .rh-next.today { stroke: var(--warn); }
    .rh-next.late { stroke: var(--danger); }
    .rh-feed { fill: var(--feed); }
    .rh-feed-next { fill: var(--surface-solid); stroke: var(--feed); stroke-width: 1.5; }
    .rh-repot { fill: var(--repot); }
    .rh-note { fill: var(--surface-solid); stroke: var(--text-2); stroke-width: 1.5; }
    .rhythm-note { margin: var(--s3) 0 0; color: var(--text-2); font-size: var(--fs-sm); }
    .rhythm-note b { color: var(--text); font-weight: 650; }

    .log-card { padding: var(--s5); }
    .log-card h2 { margin: 0 0 var(--s3); font-size: var(--fs-lg); }
    .date-field { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s3); }
    .date-field .label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
    .date-field input { width: auto; flex: 1; max-width: 200px; }
    .log-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
    .log-actions > button { min-height: 48px; flex-direction: column; gap: 4px; font-size: var(--fs-sm); }
    .log-actions > button svg { width: 16px; height: 16px; }
    .log-actions > button:not(.primary) svg { color: var(--text-2); }
    .log-actions > [data-log="fed"] svg { color: var(--feed); }
    .log-actions > [data-log="repotted"] svg { color: var(--repot); }
    .note-form { display: flex; gap: var(--s2); margin-top: var(--s3); }
    .note-form input { flex: 1; min-width: 0; }

    .history-card { padding: var(--s5); }
    .history-card h2 { margin: 0 0 var(--s2); font-size: var(--fs-lg); }
    .history { list-style: none; margin: 0; padding: 0; }
    .history > li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: var(--s3); align-items: start; padding: 10px 0; border-top: 1px solid var(--border); }
    .history > li:first-child { border-top: 0; }
    .ev-icon { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--water-soft); color: var(--water); }
    .ev-icon svg { width: 16px; height: 16px; }
    .ev-fed .ev-icon { background: var(--feed-soft); color: var(--feed); }
    .ev-repotted .ev-icon { background: var(--repot-soft); color: var(--repot); }
    .ev-note .ev-icon { background: var(--surface-2); color: var(--text-2); }
    .ev-body { min-width: 0; display: flex; flex-direction: column; gap: 1px; padding-top: 1px; }
    .ev-title { font-weight: 650; }
    .ev-when { font-size: var(--fs-sm); color: var(--text-2); }
    .ev-when .rel { color: var(--text-2); margin-left: 8px; }
    .history-text { margin-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); font-size: var(--fs-sm); }
    .history .del { color: var(--text-3); }
    .history .del:hover { color: var(--danger); }
    .history-empty { color: var(--text-2); margin: var(--s2) 0 0; }

    details.edit { padding: 0; }
    details.edit > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 52px; padding: 0 var(--s5); cursor: pointer; font: 700 var(--fs) var(--display); border-radius: var(--radius-lg); }
    details.edit > summary::-webkit-details-marker { display: none; }
    details.edit > summary::after { content: ""; width: 8px; height: 8px; border: solid var(--text-3); border-width: 0 2px 2px 0; transform: rotate(45deg) translateY(-2px); transition: transform var(--dur) var(--ease); }
    details.edit[open] > summary::after { transform: rotate(-135deg) translateY(-2px); }
    details.edit > summary .sum-sub { font: 400 var(--fs-sm) var(--font); color: var(--text-2); margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    details.edit > form { padding: 0 var(--s5) var(--s5); }
    details.edit .form-head { display: flex; justify-content: flex-end; }

    .empty .actions { margin-top: var(--s2); }

    @media (min-width: 821px) {
      .plant-layout { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); grid-template-rows: auto auto auto 1fr;
        grid-template-areas: "hero hero" "rhythm rhythm" "log history" "edit history"; }
      .plant-hero { grid-area: hero; }
      .rhythm-card { grid-area: rhythm; }
      .log-card { grid-area: log; }
      .history-card { grid-area: history; }
      details.edit { grid-area: edit; }
    }
    @media (max-width: 820px) {
      .home-top { grid-template-columns: minmax(0, 1fr); }
      .plant-hero { grid-template-columns: auto minmax(0, 1fr); gap: var(--s4); }
      .plant-hero .facts { grid-column: 1 / -1; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); border-top: 1px solid var(--border); padding-top: var(--s4); }
    }
    @media (max-width: 480px) {
      header.top h1 { font-size: 30px; }
      .today-card, .sched-card, .rhythm-card, .log-card, .history-card, .plant-hero { padding: var(--s4); }
      details.edit > summary { padding: 0 var(--s4); }
      details.edit > form { padding: 0 var(--s4) var(--s4); }
      .mini-pot { display: none; }
      .sched { --label: 62px; }
      .sched-name { font-size: 12px; padding-right: 4px; }
      .sched-days .d { font-size: 9.5px; }
      .sched-days .d b { font-size: 11px; }
      .sched .mk { width: 9px; height: 12px; }
      .sill { gap: var(--s4) var(--s3); }
      .pot-tile { --w: 104px; }
      .pot-stage svg { width: 66px; height: 83px; }
      .hero-pot svg { width: 84px; height: 105px; }
      .hero-text h1 { font-size: 30px; }
      .hero-status { font-size: 18px; }
      .two { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page stack" id="app" aria-busy="true">
    <span class="skeleton" style="height: 28px; width: 40%"></span>
    <span class="skeleton" style="height: 140px"></span>
    <span class="skeleton" style="height: 220px"></span>
  </main>
  <datalist id="locations"></datalist>
  <dialog id="confirm">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text" class="muted"></p>
    <div class="actions">
      <button type="button" class="ghost" data-answer="no">Cancel</button>
      <button type="button" class="danger solid" data-answer="yes" id="confirm-yes">Delete</button>
    </div>
  </dialog>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
