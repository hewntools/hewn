# SPDX-License-Identifier: AGPL-3.0-or-later
# Every commit in a pull request must carry a Developer Certificate of Origin sign-off
# (`git commit -s`): a "Signed-off-by: Name <email>" line matching the commit's author.
name: DCO
on: pull_request

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no 'Signed-off-by: $author'"
              fail=1
            fi
          done
          if [ "$fail" = 1 ]; then
            echo "Sign your commits: git rebase --signoff $(git rev-parse --short "$BASE") && git push --force-with-lease (see CONTRIBUTING.md)"
            exit 1
          fi
          echo "All commits are signed off."
