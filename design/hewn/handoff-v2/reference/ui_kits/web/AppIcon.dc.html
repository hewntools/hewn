<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span class="app-icon {{ cls }}" style="--size:{{ sizePx }};--hue:{{ hue }};display:inline-block;vertical-align:middle"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><span style="display:grid;grid-template-columns:repeat(5,{{ px }});grid-auto-rows:{{ px }};gap:{{ gap }};line-height:0"><sc-for list="{{ cells }}" as="c" hint-placeholder-count="25"><span style="display:block;width:{{ px }};height:{{ px }};border-radius:{{ cellR }};background:{{ c }}"></span></sc-for></span></span><sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ false }}"><span class="badge {{ badge }}"></span></sc-if><sc-if value="{{ more }}" hint-placeholder-val="{{ false }}"><span class="more">•••</span></sc-if></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;glyph&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;run&quot;,&quot;read&quot;,&quot;heart&quot;,&quot;week&quot;,&quot;lock&quot;,&quot;one&quot;,&quot;cup&quot;,&quot;plus&quot;],&quot;default&quot;:&quot;run&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hue&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;min&quot;:0,&quot;max&quot;:360,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;min&quot;:20,&quot;max&quot;:120,&quot;tsType&quot;:&quot;number&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;warn&quot;,&quot;danger&quot;,&quot;live&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;more&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  static G = {
    run: ['....#','...##','..###','.####','#####'], read: ['#####','.....','####.','.....','###..'],
    heart: ['##.##','#####','#####','.###.','..#..'], week: ['#.#.#','.....','#.#.#','.....','#.#.#'],
    lock: ['.###.','.#.#.','#####','##.##','#####'], one: ['.##..','..#..','..#..','..#..','.###.'],
    cup: ['#...#','#####','#####','.###.','.###.'], plus: ['.....','..#..','.###.','..#..','.....'],
    hewn: ['##..#','.#..#','.####','.#..#','.#..#'],
    words: ['###..','.....','#####','.....','##...'], plug: ['.#.#.','.#.#.','#####','.###.','..#..'],
    check: ['....#','...#.','#.#..','.#...','.....'], cal: ['#####','#.#.#','#####','#.#.#','#####'],
  };
  renderVals() {
    const size = Number(this.props.size ?? 64);
    const g = Component.G[this.props.glyph] || Component.G.plus;
    const pxN = size >= 40 ? Math.round(size * 0.093) : +(size * 0.088).toFixed(2);
    const p = this.props.progress, building = p != null && p !== '' && p >= 0;
    const on = Math.round(g.join('').split('#').length - 1) * (building ? Number(p) : 1); let lit = 0;
    return {
      sizePx: size + 'px', hue: this.props.hue ?? 260, px: pxN + 'px', cellR: size >= 56 ? '1px' : '0', gap: (size >= 40 ? Math.max(1, Math.round(pxN * 0.25)) : +(pxN * 0.25).toFixed(2)) + 'px',
      cls: this.props.glyph === 'plus' ? 'add' : this.props.glyph === 'hewn' ? 'brand' : building ? 'building' : '',
      cells: g.join('').split('').map(ch => { if (ch !== '#') return 'transparent'; lit++; return !building || lit <= on ? 'currentColor' : 'color-mix(in oklch, currentColor 22%, transparent)'; }),
      hasBadge: !!this.props.badge, badge: this.props.badge === 'warn' ? '' : this.props.badge, more: !!this.props.more,
    };
  }
}
</script>
</body>
</html>
