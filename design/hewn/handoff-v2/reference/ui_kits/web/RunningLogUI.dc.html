<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:28px 32px;display:flex;flex-direction:column;gap:16px;max-width:820px">
  <div style="display:flex;align-items:center;justify-content:space-between"><h1 style="margin:0">This month</h1><div class="segmented"><button>Week</button><button aria-pressed="true">Month</button><button>Year</button></div></div>
  <div class="stats">
    <div class="stat"><div class="label">Distance</div><div class="value">86.4<small>km</small></div></div>
    <div class="stat"><div class="label">Runs</div><div class="value">12</div></div>
    <div class="stat"><div class="label">Avg pace</div><div class="value">5:28<small>/km</small></div></div>
  </div>
  <div class="card">
    <div class="eyebrow" style="margin-bottom:12px">Weekly km</div>
    <div style="display:flex;align-items:flex-end;gap:12px;height:110px">
      <sc-for list="{{ bars }}" as="b" hint-placeholder-count="8"><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end"><div style="width:100%;height:{{ b.h }};border-radius:3px 3px 1px 1px;background:var(--c1)"></div><div class="mono faint" style="font-size:10.5px">{{ b.l }}</div></div></sc-for>
    </div>
  </div>
  <div class="table-wrap"><table><thead><tr><th>Date</th><th class="num">km</th><th class="num">Time</th><th>Notes</th></tr></thead><tbody><tr><td>Oct 17</td><td class="num">10.0</td><td class="num">55:12</td><td class="muted">Long, easy</td></tr><tr><td>Oct 15</td><td class="num">6.2</td><td class="num">31:40</td><td class="muted">Tempo</td></tr><tr><td>Oct 13</td><td class="num">5.0</td><td class="num">28:05</td><td class="muted">Recovery</td></tr></tbody></table></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:600}}">
class Component extends DCLogic {
  renderVals() {
    return { bars: [['W35', 14], ['W36', 18], ['W37', 12], ['W38', 22], ['W39', 19], ['W40', 25], ['W41', 21], ['W42', 16]].map(([l, v]) => ({ l, h: Math.round(v / 25 * 90) + 'px' })) };
  }
}
</script>
</body>
</html>
